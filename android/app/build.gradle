plugins {
    id 'com.android.application'
}

// CI(GitHub Actions)가 실행 번호를 버전으로 넘겨준다 (-PversionCode=…). 직접 빌드하면 1
def appVersion = (project.findProperty('versionCode') ?: '1') as int
// 서명 키: CI에서는 저장소 Secrets로 만든 파일(ANDROID_KEYSTORE_FILE), 직접 빌드할 때는 android/release.keystore
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE') ?: rootProject.file('release.keystore').path
// 앱에 넣는 서버 주소: 켜면 이 주소로 바로 연결한다. 다른 주소로 빌드하려면 -PserverUrl=https://… (CI는 저장소 변수 DOTORI_SERVER)
def serverUrl = (project.findProperty('serverUrl') ?: 'https://dotori.tailf5847f.ts.net').toString().replaceAll('/+$', '')

android {
    namespace 'kr.dotori.forest'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.dotori.forest'
        minSdk 24
        targetSdk 34
        versionCode appVersion
        versionName "1.${appVersion}"
        // 앱이 새 버전을 확인하는 GitHub 저장소 (Releases)
        buildConfigField 'String', 'UPDATE_REPO', '"Wany-ww/dotori"'
        buildConfigField 'String', 'SERVER', "\"${serverUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(keystoreFile)
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'dotori'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
