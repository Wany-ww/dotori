<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도토리숲 서버 연결</title>
<style>
  :root { --paper: #FFF8EC; --ink: #4A3626; --soft: #8A715C; --acorn: #D97A33; --leaf: #4FA36B; --coral: #EE6C5F; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); font-family: system-ui, "Noto Sans KR", sans-serif; }
  main { width: min(440px, 100%); padding: 28px 22px; border-radius: 24px; background: #fff; box-shadow: 0 10px 30px rgba(120, 80, 40, .12); text-align: center; }
  .logo { font-size: 56px; line-height: 1; }
  h1 { margin: 10px 0 6px; font-size: 24px; }
  p { margin: 0 0 14px; color: var(--soft); line-height: 1.6; font-size: 15px; }
  label { display: block; margin: 18px 0 8px; text-align: left; font-weight: 700; }
  input { width: 100%; padding: 14px 16px; border: 2px solid #E8D9C5; border-radius: 14px; font-size: 17px; color: var(--ink); background: #FFFCF6; }
  input:focus { outline: none; border-color: var(--acorn); }
  button { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px; font-size: 18px; font-weight: 700; color: #fff; background: var(--acorn); box-shadow: 0 5px 0 #B35F22; }
  button.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px #E8D9C5; }
  button:disabled { opacity: .6; }
  .msg { min-height: 24px; margin-top: 14px; font-size: 15px; line-height: 1.5; }
  .msg.bad { color: var(--coral); }
  .msg.wait { color: var(--soft); }
  .hint { margin-top: 18px; text-align: left; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🌰</div>
  <h1 id="title">도토리숲 서버 연결</h1>
  <p id="lead">집에 있는 NAS의 도토리숲 서버 주소를 적어 주세요. 한 번만 적으면 다음부터는 바로 열려요.</p>
  <div id="offline" hidden>
    <button id="retry" type="button">다시 시도</button>
  </div>
  <form id="form">
    <label for="url">서버 주소</label>
    <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="https://dotori.tail1234.ts.net">
    <button id="go" type="submit">연결하기</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <p class="hint">밖(데이터 · 다른 와이파이)에서는 이 휴대폰에서 Tailscale 앱을 켜고, https://dotori.<i>tailnet 이름</i>.ts.net 주소를 적어요. 집 와이파이 안에서는 http://192.168.0.10:5173 처럼 NAS의 내부 주소도 돼요.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const msg = (text, cls) => { $('msg').textContent = text; $('msg').className = `msg ${cls || ''}`; };
  const WHY = {
    offline: '서버에 연결하지 못했어요. 이 휴대폰의 Tailscale이 켜져 있는지, 주소와 NAS가 켜져 있는지 확인해 주세요.',
    ssl: '보안 인증서(HTTPS)를 확인할 수 없어요. NAS의 인증서 설정을 확인하거나, 집 안에서는 http:// 내부 주소로 해 보세요.',
    notdotori: '이 주소에서 도토리숲 서버를 찾지 못했어요. 주소와 포트를 확인해 주세요.',
  };
  $('url').value = q.get('server') || '';
  if (q.get('error') === 'offline' && q.get('server')) {
    $('title').textContent = '서버에 연결하지 못했어요';
    $('lead').textContent = '이 휴대폰의 Tailscale이 켜져 있는지, 인터넷 연결과 NAS를 확인한 뒤 다시 시도해 주세요. 주소가 바뀌었으면 아래에서 고쳐요.';
    $('offline').hidden = false;
  }
  $('retry').addEventListener('click', () => { msg('다시 연결하고 있어요…', 'wait'); window.DotoriNative.retry(); });
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('url').value.trim();
    if (!v) { msg('서버 주소를 적어 주세요.', 'bad'); $('url').focus(); return; }
    $('go').disabled = true;
    msg('도토리숲 서버인지 확인하고 있어요…', 'wait');
    window.DotoriNative.checkServer(v);
  });
  // 앱이 확인 결과를 알려 준다 (성공하면 앱이 바로 서버 화면을 연다)
  window.onCheck = (ok, url, why) => {
    $('go').disabled = false;
    if (!ok) msg(WHY[why] || WHY.offline, 'bad');
  };
</script>
</body>
</html>
