# 도토리숲 서버 (NAS · Docker). 이 파일 하나만 있으면 돼요 (이미지를 직접 빌드하지 않아요).
#  - 시놀로지: Container Manager → 프로젝트 → 생성에서 이 파일을 열어요
#  - 유그린: Docker → 프로젝트 → 생성에 이 내용을 붙여 넣어요 (HTTPS까지 하려면 docker-compose.ugreen.yml)
# 컨테이너가 켜질 때 GitHub 저장소를 받아 서버를 돌리고, UPDATE_MINUTES분마다 새 커밋을 확인해서 저절로 업데이트해요.
services:
  dotori:
    image: node:22-alpine
    container_name: dotori
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - TZ=Asia/Seoul
      - PORT=5173
      - DATA_DIR=/app/data
      - APP_DIR=/app/src
      - REPO_URL=https://github.com/Wany-ww/dotori.git
      - BRANCH=main
      # 새 커밋 확인 간격(분). AUTO_UPDATE=0 이면 자동 업데이트를 꺼요
      - UPDATE_MINUTES=5
      - AUTO_UPDATE=1
    # git을 깔고, 저장소가 없으면 받은 뒤, 저장소 안의 실행기(tools/runner.js)를 돌린다
    command: >-
      sh -c 'apk add --no-cache git >/dev/null &&
      ([ -d "$$APP_DIR/.git" ] || git clone --depth 1 --branch "$$BRANCH" "$$REPO_URL" "$$APP_DIR") &&
      exec node "$$APP_DIR/tools/runner.js"'
    volumes:
      # 아이 · 보호자 기록이 쌓이는 곳 (NAS의 이 폴더를 백업해 주세요)
      - ./data:/app/data
