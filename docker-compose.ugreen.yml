# 유그린 NAS(UGOS Pro)용: 도토리숲 서버 + HTTPS 입구(Nginx Proxy Manager)
# UGOS Pro에는 시놀로지 같은 역방향 프록시 · Let's Encrypt 자동 발급이 없어서, 그 일을 Nginx Proxy Manager 컨테이너가 해요.
# Docker → 프로젝트 → 생성에 이 내용을 붙여 넣어요. 설정 순서는 docs/nas.md의 "유그린 NAS"에 있어요.
#
#   밖(https 443) ─공유기─▶ NAS 8443 ─▶ proxy(인증서) ─▶ dotori:5173
#   밖(http 80)   ─공유기─▶ NAS 8080 ─▶ proxy (인증서 발급 · 갱신, https로 넘기기)
services:
  dotori:
    image: node:22-alpine
    container_name: dotori
    restart: unless-stopped
    ports:
      # 집 와이파이 안에서 바로 쓰는 주소 (http://NAS내부IP:5173). 공유기에서는 열지 않아요
      - "5173:5173"
    environment:
      - TZ=Asia/Seoul
      - PORT=5173
      - DATA_DIR=/app/data
      - APP_DIR=/app/src
      - REPO_URL=https://github.com/Wany-ww/dotori.git
      - BRANCH=main
      # 새 커밋 확인 간격(분). AUTO_UPDATE=0 이면 자동 업데이트를 꺼요
      - UPDATE_MINUTES=5
      - AUTO_UPDATE=1
    # git을 깔고, 저장소가 없으면 받은 뒤, 저장소 안의 실행기(tools/runner.js)를 돌린다
    command: >-
      sh -c 'apk add --no-cache git >/dev/null &&
      ([ -d "$$APP_DIR/.git" ] || git clone --depth 1 --branch "$$BRANCH" "$$REPO_URL" "$$APP_DIR") &&
      exec node "$$APP_DIR/tools/runner.js"'
    volumes:
      # 아이 · 보호자 기록이 쌓이는 곳 (NAS의 이 폴더를 백업해 주세요)
      - ./data:/app/data

  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: dotori-proxy
    restart: unless-stopped
    ports:
      # NAS의 80 · 443은 UGOS가 쓸 수 있어서 8080 · 8443으로 받고, 공유기에서 80 → 8080, 443 → 8443으로 넘겨요
      - "8080:80"
      - "8443:443"
      # 프록시 관리 화면 (집 안에서만: http://NAS내부IP:8181). 공유기에서는 열지 않아요
      - "8181:81"
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt
