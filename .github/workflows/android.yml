# 안드로이드 앱(APK) 빌드 · 배포
# android/ 가 바뀌어 main에 올라가면 APK를 만든다.
#  - 저장소 Secrets에 서명 키가 있으면: 같은 키로 서명한 APK를 GitHub Releases(app-<번호>)에 올린다.
#    설치된 앱이 켜질 때 이 릴리스를 보고 새 버전을 받아 설치한다 (docs/nas.md).
#  - 서명 키가 없으면: 디버그 APK만 실행 결과(Artifacts)에 올린다.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        id: key
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::서명 키 Secrets가 없어서 디버그 APK만 만들어요 (docs/nas.md 참고)"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # 버전 번호는 실행 번호로 늘 커진다 (직접 빌드한 앱은 1)
          VERSION=$((GITHUB_RUN_NUMBER + 1))
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew "$TASK" -PversionCode="$VERSION" --no-daemon --console=plain
          mkdir -p ../dist
          cp app/build/outputs/apk/*/app-*.apk "../dist/dotori-1.$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dotori-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: steps.key.outputs.signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ env.VERSION }}
          name: 도토리숲 앱 1.${{ env.VERSION }}
          body: 앱이 켜질 때 이 버전을 찾아 업데이트를 물어요. 처음 설치는 아래 APK를 휴대폰에서 열어요.
          files: dist/*.apk
          make_latest: true
